<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jorge & Astrid</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #inicio { position: fixed; inset: 0; z-index: 10000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #btn-comenzar { padding: 20px 40px; background: #2563eb; color: white; border-radius: 12px; border: 0; font-size: 18px; font-weight: bold; }
    #btn-flash { position: fixed; top: 20px; left: 20px; z-index: 5000; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; display: none; align-items: center; justify-content: center; }
    #video-container { position: fixed; inset: 0; z-index: 6000; display: none; background: #000; }
    #video-pantalla { width: 100%; height: 100%; object-fit: cover; }
    #btn-cerrar { position: absolute; top: 20px; right: 20px; z-index: 6001; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; border-radius: 50%; width: 44px; height: 44px; }
  </style>
</head>

<body>
  <div id="inicio">
    <button id="btn-comenzar">Comenzar Experiencia</button>
  </div>
  
  <button id="btn-flash">🔦</button>

  <div id="video-container">
    <button id="btn-cerrar">&times;</button>
    <video id="video-pantalla" playsinline webkit-playsinline loop></video>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targets-group"></a-entity>
  </a-scene>

  <script>
    const btnComenzar = document.getElementById('btn-comenzar');
    const btnFlash = document.getElementById('btn-flash');
    const sceneEl = document.querySelector('a-scene');
    const video = document.getElementById('video-pantalla');
    const container = document.getElementById('video-container');
    let flashEncendido = false;

    function getCameraTrack() {
      const mindarSystem = sceneEl.systems['mindar-image-system'];
      const videoEl = mindarSystem?.video;
      return videoEl?.srcObject?.getVideoTracks()[0];
    }

    btnFlash.addEventListener('click', async () => {
      const track = getCameraTrack();
      
      if (!track) {
        alert("Error: Cámara no detectada.");
        return;
      }
      
      if (typeof track.getCapabilities !== 'function') {
        alert("Tu navegador no soporta la API de linterna (getCapabilities). Usa Chrome.");
        return;
      }

      const caps = track.getCapabilities();
      if (!caps.torch) {
        alert("Tu dispositivo reporta que no tiene linterna o la cámara no está en modo trasero.");
        return;
      }

      try {
        flashEncendido = !flashEncendido;
        await track.applyConstraints({ advanced: [{ torch: flashEncendido }] });
        btnFlash.style.background = flashEncendido ? '#facc15' : 'rgba(0,0,0,0.7)';
      } catch (e) {
        alert("Error al aplicar torch: " + e.message);
      }
    });

    btnComenzar.addEventListener('click', async () => {
      try {
        await sceneEl.systems['mindar-image-system'].start();
        document.getElementById('inicio').style.display = 'none';
        btnFlash.style.display = 'flex';
      } catch (e) {
        alert("No se pudo iniciar la cámara: " + e.message);
      }
    });

    document.getElementById('btn-cerrar').addEventListener('click', () => {
      video.pause();
      container.style.display = 'none';
    });
  </script>
</body>
</html>
